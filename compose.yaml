services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
