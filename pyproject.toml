[project]
name = "rag-learning-project"
version = "0.1.0"
description = "A transparent FastAPI foundation for learning embeddings and RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.68,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["work"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
